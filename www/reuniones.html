<html>
  <head>
    <meta charset="utf-8" />
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Hello World</title>
  </head>
  <body>
    <div class="header">
      <h1>SmartOffice Connect</h1>
      <p>Gestión empresarial inteligente</p>
    </div>

    <body>

    <div class="header">
        <h1>Reuniones</h1>
        <p>Programación de reuniones corporativas</p>
    </div>

    <main>

        <div class="formulario">

            <input
                type="text"
                id="titulo"
                placeholder="Título de la reunión">

            <input
                type="datetime-local"
                id="fecha">

            <button id="btnGuardar">
                Guardar reunión
            </button>

        </div>

        <div class="lista-reuniones">

            <h2>Próximas reuniones</h2>

            <ul id="listaReuniones"></ul>

        </div>

        <button
            id="btnVolver"
            class="btn-volver">

            ← Volver

        </button>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="js/app.js"></script>
    script src="js/reuniones.js"></script>
  </body>
</html>
